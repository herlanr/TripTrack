name: trip_track
description: "TripTrack - Digitales Fahrtenbuch mit automatischer GPS-Standorterfassung."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # iOS-Icons-Unterstützung
  cupertino_icons: ^1.0.8

  # GPS-Ortungsdienst & Live-Standortabfrage
  geolocator: ^14.0.3

  # Verwaltung von App-Standortberechtigungen
  permission_handler: ^13.0.2

  # Darstellung von interaktiven OpenStreetMap-Karten
  flutter_map: ^8.3.2

  # Geografische Berechnungen & Koordinaten-Typen
  latlong2: ^0.10.1

  # Lokale Persistenz von Fahrten, Fahrern und Fahrzeugen
  shared_preferences: ^2.5.5

  # Geocoding-Hilfsmittel
  geocoding: ^5.0.0

  # HTTP-Anfragen für Reverse-Geocoding via Nominatim API
  http: ^1.6.0

  # Generierung von CSV-Dateien für den Fahrtenbuch-Export
  csv: ^8.0.0

  # Teilen-Funktion für PDF- & CSV-Exporte über Betriebssystem
  share_plus: ^13.3.1

  # Dateisystem-Pfade für Exporte
  path_provider: ^2.1.6

  # Generierung von PDF-Dokumenten für den Fahrtenbuch-Export
  pdf: ^3.11.1

  # Anmerkungen für automatische JSON-Serialisierung
  json_annotation: ^4.12.0

dev_dependencies:
  # Test-Framework für Flutter
  flutter_test:
    sdk: flutter

  # Empfohlene Code-Linter-Regeln
  flutter_lints: ^6.0.0

  # Codegenerator für JSON-Serialisierung
  json_serializable: ^6.14.1

  # Build-Tool für automatische Codegenerierung
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
